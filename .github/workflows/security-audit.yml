name: Security & static audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required public files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f uk/index.html
          test -f sv/index.html
          test -f ru/index.html
          test -f styles.css
          test -f script.js
          test -f _headers
          test -f robots.txt
          test -f sitemap.xml
          test -f .well-known/security.txt
          test -f 404.html
          test -f privacy.html
          test -f services/web-design/index.html
          test -f services/web-infrastructure/index.html
          test -f services/automation/index.html
          test -f services/smart-home/index.html
          test -f services/technical-consulting/index.html
          test -f services/electrical/index.html
          test -f sv/tjanster/webbdesign/index.html
          test -f sv/tjanster/webbinfrastruktur/index.html
          test -f sv/tjanster/automation/index.html
          test -f sv/tjanster/smarta-hem/index.html
          test -f sv/tjanster/teknisk-radgivning/index.html
          test -f sv/tjanster/el/index.html
          test -f uk/services/web-design/index.html
          test -f uk/services/web-infrastructure/index.html
          test -f uk/services/automation/index.html
          test -f uk/services/smart-home/index.html
          test -f uk/services/technical-consulting/index.html
          test -f uk/services/electrical/index.html
          test -f ru/services/web-design/index.html
          test -f ru/services/web-infrastructure/index.html
          test -f ru/services/automation/index.html
          test -f ru/services/smart-home/index.html
          test -f ru/services/technical-consulting/index.html
          test -f ru/services/electrical/index.html
          test -f projects/sweden-no-sugar/index.html
          test -f projects/wise-quotes-world/index.html
          test -f sv/projects/sweden-no-sugar/index.html
          test -f sv/projects/wise-quotes-world/index.html
          test -f uk/projects/sweden-no-sugar/index.html
          test -f uk/projects/wise-quotes-world/index.html
          test -f ru/projects/sweden-no-sugar/index.html
          test -f ru/projects/wise-quotes-world/index.html
          test -f areas/stockholm/index.html
          test -f sv/omraden/stockholm/index.html
          test -f uk/areas/stockholm/index.html
          test -f ru/areas/stockholm/index.html
          test -f areas/haninge/index.html
          test -f sv/omraden/haninge/index.html
          test -f uk/areas/haninge/index.html
          test -f ru/areas/haninge/index.html
          test -f areas/vasterhaninge/index.html
          test -f sv/omraden/vasterhaninge/index.html
          test -f uk/areas/vasterhaninge/index.html
          test -f ru/areas/vasterhaninge/index.html
          test -f areas/handen/index.html
          test -f sv/omraden/handen/index.html
          test -f uk/areas/handen/index.html
          test -f ru/areas/handen/index.html
          test -f areas/botkyrka/index.html
          test -f sv/omraden/botkyrka/index.html
          test -f uk/areas/botkyrka/index.html
          test -f ru/areas/botkyrka/index.html
          test -f guides/website-cost-stockholm/index.html
          test -f guides/smart-home-planning-stockholm/index.html
          test -f guides/business-automation-sweden/index.html
          test -f sv/guider/vad-kostar-hemsida-stockholm/index.html
          test -f sv/guider/smarta-hem-planering-stockholm/index.html
          test -f sv/guider/automation-smaforetag/index.html
          test -f uk/guides/website-cost-stockholm/index.html
          test -f uk/guides/smart-home-planning-stockholm/index.html
          test -f uk/guides/business-automation-sweden/index.html
          test -f ru/guides/website-cost-stockholm/index.html
          test -f ru/guides/smart-home-planning-stockholm/index.html
          test -f ru/guides/business-automation-sweden/index.html
          test -f site.webmanifest
          test -f favicon.svg
      - name: Verify security headers contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Strict-Transport-Security:" _headers
          grep -q "Content-Security-Policy:" _headers
          grep -q "X-Content-Type-Options: nosniff" _headers
          grep -q "frame-ancestors 'none'" _headers
          grep -q "object-src 'none'" _headers
          grep -q "form-action https://formsubmit.co" _headers
      - name: Reject inline executable or style markup
        shell: bash
        run: |
          set -euo pipefail
          html_files=(index.html uk/index.html sv/index.html ru/index.html privacy.html 404.html)
          if grep -Ei 'style="|on(click|load|error|submit|focus|mouseover)=' "${html_files[@]}"; then
            echo "Inline style/event handler detected; keep CSP-compatible markup" >&2
            exit 1
          fi
          if grep -Ei '<script(>|[[:space:]][^>]*>)[^<]+' "${html_files[@]}"; then
            echo "Inline script content detected; move JavaScript to script.js" >&2
            exit 1
          fi
      - name: Verify contact form transport and secret hygiene
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q "https://formsubmit.co/alex.shtogryn@gmail.com" index.html uk/index.html sv/index.html ru/index.html
          if grep -RIE --exclude-dir=.git --exclude='security-audit.yml' '(api[_-]?key|access[_-]?token|client[_-]?secret|authorization: bearer)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_./+-]{16,}' .; then
            echo "Potential committed credential detected" >&2
            exit 1
          fi
      - name: Verify sitemap routes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'https://shtogryn.com/' sitemap.xml
          grep -q 'https://shtogryn.com/uk/' sitemap.xml
          grep -q 'https://shtogryn.com/sv/' sitemap.xml
          grep -q 'https://shtogryn.com/ru/' sitemap.xml
          grep -q 'https://shtogryn.com/privacy' sitemap.xml
          grep -q 'https://shtogryn.com/services/web-design/' sitemap.xml
          grep -q 'https://shtogryn.com/sv/tjanster/webbdesign/' sitemap.xml
          grep -q 'https://shtogryn.com/uk/services/web-design/' sitemap.xml
          grep -q 'https://shtogryn.com/ru/services/web-design/' sitemap.xml
          grep -q 'https://shtogryn.com/services/technical-consulting/' sitemap.xml
          grep -q 'https://shtogryn.com/services/electrical/' sitemap.xml
          grep -q 'https://shtogryn.com/sv/tjanster/el/' sitemap.xml
          grep -q 'https://shtogryn.com/uk/services/electrical/' sitemap.xml
          grep -q 'https://shtogryn.com/ru/services/electrical/' sitemap.xml
          grep -q 'https://shtogryn.com/sv/tjanster/teknisk-radgivning/' sitemap.xml
          grep -q 'https://shtogryn.com/uk/services/technical-consulting/' sitemap.xml
          grep -q 'https://shtogryn.com/ru/services/technical-consulting/' sitemap.xml
          grep -q 'https://shtogryn.com/projects/sweden-no-sugar/' sitemap.xml
          grep -q 'https://shtogryn.com/projects/wise-quotes-world/' sitemap.xml
          grep -q 'https://shtogryn.com/sv/projects/sweden-no-sugar/' sitemap.xml
          grep -q 'https://shtogryn.com/uk/projects/sweden-no-sugar/' sitemap.xml
          grep -q 'https://shtogryn.com/ru/projects/sweden-no-sugar/' sitemap.xml
          grep -q 'https://shtogryn.com/areas/stockholm/' sitemap.xml
          grep -q 'https://shtogryn.com/sv/omraden/stockholm/' sitemap.xml
          grep -q 'https://shtogryn.com/uk/areas/stockholm/' sitemap.xml
          grep -q 'https://shtogryn.com/ru/areas/stockholm/' sitemap.xml
          grep -q 'https://shtogryn.com/areas/haninge/' sitemap.xml
          grep -q 'https://shtogryn.com/sv/omraden/haninge/' sitemap.xml
          grep -q 'https://shtogryn.com/uk/areas/haninge/' sitemap.xml
          grep -q 'https://shtogryn.com/ru/areas/haninge/' sitemap.xml
          grep -q 'https://shtogryn.com/areas/vasterhaninge/' sitemap.xml
          grep -q 'https://shtogryn.com/sv/omraden/vasterhaninge/' sitemap.xml
          grep -q 'https://shtogryn.com/uk/areas/vasterhaninge/' sitemap.xml
          grep -q 'https://shtogryn.com/ru/areas/vasterhaninge/' sitemap.xml
          grep -q 'https://shtogryn.com/areas/handen/' sitemap.xml
          grep -q 'https://shtogryn.com/sv/omraden/handen/' sitemap.xml
          grep -q 'https://shtogryn.com/uk/areas/handen/' sitemap.xml
          grep -q 'https://shtogryn.com/ru/areas/handen/' sitemap.xml
          grep -q 'https://shtogryn.com/areas/botkyrka/' sitemap.xml
          grep -q 'https://shtogryn.com/sv/omraden/botkyrka/' sitemap.xml
          grep -q 'https://shtogryn.com/uk/areas/botkyrka/' sitemap.xml
          grep -q 'https://shtogryn.com/ru/areas/botkyrka/' sitemap.xml
          grep -q 'https://shtogryn.com/guides/website-cost-stockholm/' sitemap.xml
          grep -q 'https://shtogryn.com/guides/smart-home-planning-stockholm/' sitemap.xml
          grep -q 'https://shtogryn.com/guides/business-automation-sweden/' sitemap.xml
          grep -q 'https://shtogryn.com/sv/guider/vad-kostar-hemsida-stockholm/' sitemap.xml
          grep -q 'https://shtogryn.com/sv/guider/smarta-hem-planering-stockholm/' sitemap.xml
          grep -q 'https://shtogryn.com/sv/guider/automation-smaforetag/' sitemap.xml
          grep -q 'https://shtogryn.com/uk/guides/website-cost-stockholm/' sitemap.xml
          grep -q 'https://shtogryn.com/uk/guides/smart-home-planning-stockholm/' sitemap.xml
          grep -q 'https://shtogryn.com/uk/guides/business-automation-sweden/' sitemap.xml
          grep -q 'https://shtogryn.com/ru/guides/website-cost-stockholm/' sitemap.xml
          grep -q 'https://shtogryn.com/ru/guides/smart-home-planning-stockholm/' sitemap.xml
          grep -q 'https://shtogryn.com/ru/guides/business-automation-sweden/' sitemap.xml
      - name: JavaScript syntax check
        run: node --check script.js

  codeql:
    name: CodeQL JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
