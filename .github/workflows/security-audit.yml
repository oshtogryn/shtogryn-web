name: Security & static audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required public files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f uk/index.html
          test -f sv/index.html
          test -f ru/index.html
          test -f styles.css
          test -f script.js
          test -f _headers
          test -f robots.txt
          test -f sitemap.xml
          test -f .well-known/security.txt
          test -f 404.html
          test -f privacy.html
          test -f services/web-design/index.html
          test -f services/web-infrastructure/index.html
          test -f services/automation/index.html
          test -f services/smart-home/index.html
          test -f sv/tjanster/webbdesign/index.html
          test -f sv/tjanster/webbinfrastruktur/index.html
          test -f sv/tjanster/automation/index.html
          test -f sv/tjanster/smarta-hem/index.html
          test -f uk/services/web-design/index.html
          test -f uk/services/web-infrastructure/index.html
          test -f uk/services/automation/index.html
          test -f uk/services/smart-home/index.html
          test -f ru/services/web-design/index.html
          test -f ru/services/web-infrastructure/index.html
          test -f ru/services/automation/index.html
          test -f ru/services/smart-home/index.html
          test -f functions/api/contact.js
          test -f projects/sweden-no-sugar/index.html
          test -f projects/wise-quotes-world/index.html
          test -f sv/projects/sweden-no-sugar/index.html
          test -f uk/projects/sweden-no-sugar/index.html
          test -f ru/projects/sweden-no-sugar/index.html
          test -f site.webmanifest
          test -f favicon.svg
      - name: Verify security headers contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Strict-Transport-Security:" _headers
          grep -q "Content-Security-Policy:" _headers
          grep -q "X-Content-Type-Options: nosniff" _headers
          grep -q "frame-ancestors 'none'" _headers
          grep -q "object-src 'none'" _headers
          grep -q "form-action 'self'" _headers
          grep -q "challenges.cloudflare.com" _headers
      - name: Reject inline executable or style markup
        shell: bash
        run: |
          set -euo pipefail
          html_files=(index.html uk/index.html sv/index.html ru/index.html privacy.html 404.html)
          if grep -Ei 'style="|on(click|load|error|submit|focus|mouseover)=' "${html_files[@]}"; then
            echo "Inline style/event handler detected; keep CSP-compatible markup" >&2
            exit 1
          fi
          if grep -Ei '<script(>|[[:space:]][^>]*>)[^<]+' "${html_files[@]}"; then
            echo "Inline script content detected; move JavaScript to script.js" >&2
            exit 1
          fi
      - name: Verify contact form transport and secret hygiene
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -q "formsubmit.co" index.html uk/index.html sv/index.html ru/index.html _headers; then echo "FormSubmit reference remains" >&2; exit 1; fi
          grep -q "api.brevo.com/v3/smtp/email" functions/api/contact.js
          grep -q "siteverify" functions/api/contact.js
          grep -q "action=\"/api/contact\"" index.html uk/index.html sv/index.html ru/index.html
          if grep -RIE --exclude-dir=.git --exclude='security-audit.yml' '(api[_-]?key|access[_-]?token|client[_-]?secret|authorization: bearer)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_./+-]{16,}' .; then
            echo "Potential committed credential detected" >&2
            exit 1
          fi
      - name: Verify sitemap routes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'https://shtogryn.com/' sitemap.xml
          grep -q 'https://shtogryn.com/uk/' sitemap.xml
          grep -q 'https://shtogryn.com/sv/' sitemap.xml
          grep -q 'https://shtogryn.com/ru/' sitemap.xml
          grep -q 'https://shtogryn.com/privacy' sitemap.xml
          grep -q 'https://shtogryn.com/services/web-design/' sitemap.xml
          grep -q 'https://shtogryn.com/sv/tjanster/webbdesign/' sitemap.xml
          grep -q 'https://shtogryn.com/uk/services/web-design/' sitemap.xml
          grep -q 'https://shtogryn.com/ru/services/web-design/' sitemap.xml
          grep -q 'https://shtogryn.com/projects/sweden-no-sugar/' sitemap.xml
          grep -q 'https://shtogryn.com/projects/wise-quotes-world/' sitemap.xml
      - name: JavaScript syntax check
        run: |
          node --check script.js
          node --check functions/api/contact.js

  codeql:
    name: CodeQL JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
